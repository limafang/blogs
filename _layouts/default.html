<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101314">
    {% if page.title %}<title>{{ page.title }} · {{ site.title }}</title>{% else %}<title>{{ site.title }}</title>{% endif %}
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="回到首页">
          <span class="brand-mark">思</span>
          <span>{{ site.title }}</span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ '/' | relative_url }}">文章</a>
          <a href="{{ '/about/' | relative_url }}">关于</a>
          <a class="nav-icon" href="https://github.com/limafang/blogs" aria-label="GitHub 仓库" title="GitHub 仓库">↗</a>
        </nav>
      </header>
      <main>{{ content }}</main>
      <footer class="site-footer">
        <span>把直觉写下来，再沿着证据回头检查。</span>
        <a href="{{ '/feed.xml' | relative_url }}">订阅 RSS</a>
      </footer>
    </div>
  </body>
</html>
